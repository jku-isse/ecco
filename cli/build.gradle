plugins {
	alias(libs.plugins.graalvm.native)
}

apply plugin: 'application'
mainClassName = "at.jku.isse.ecco.cli.Main"
applicationName = "ecco"
applicationDefaultJvmArgs = ["-Xss1024m", "-Xmx8g"]

graalvmNative {
	binaries {
		main {
			mainClass = 'at.jku.isse.ecco.cli.Main'
			imageName = 'ecco'
			buildArgs.add('--no-fallback')
		}
	}
}

configurations.runtimeClasspath {
	// no GUI here (ecco.headless): the adapters' JavaFX viewers are not loaded, so JavaFX is left
	// out - it used to come along bundled into the file adapter's jar
	exclude group: 'org.openjfx'
}

dependencies {
	implementation libs.argparse4j
	implementation libs.logicng.core

	implementation project(':ecco-service')

	// the same adapters as the GUI: a repository's .adapters maps files to adapters by id, and a
	// commit fails if a mapped adapter is missing - with fewer adapters the CLI could not commit to
	// repositories created with the GUI
	runtimeOnly project(':ecco-adapter-file')
	runtimeOnly project(':ecco-adapter-text')
	runtimeOnly project(':ecco-adapter-markdown')
	runtimeOnly project(':ecco-adapter-lilypond')
	runtimeOnly project(':ecco-adapter-image')
	runtimeOnly project(':ecco-adapter-typescript')
	runtimeOnly project(':ecco-adapter-python')
	runtimeOnly project(':ecco-adapter-challenge')
	runtimeOnly project(':ecco-adapter-java')
	runtimeOnly project(':ecco-adapter-java-ast')
	runtimeOnly project(':ecco-adapter-c')
	runtimeOnly project(':ecco-adapter-cpp')
	runtimeOnly project(':ecco-adapter-runtime')
	runtimeOnly project(':ecco-adapter-golang')

	testImplementation project(':ecco-adapter-file')
	testImplementation project(':ecco-adapter-text')
	testImplementation project(':ecco-adapter-markdown')
	testImplementation project(':ecco-adapter-image')
	testImplementation project(':ecco-adapter-golang')

	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	testImplementation libs.mockito.core
}

ospackage {
	summary 'CLI (Command Line Interface) for ECCO.'
	packageDescription 'This package provides a CLI (Command Line Interface) for ECCO.'

	requires('ecco-base', version, EQUAL)
	requires('ecco-service', version, EQUAL)

	requires('javapackages-tools')

	into('/usr/bin/') {
		from(project.file('ecco')) {
			addParentDirs false
			into ''
		}
	}
}

linuxZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco'
	}
}

sourcesZip {
	include 'ecco'
	include 'ecco.bat'
}

windowsZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco.bat'
	}
}

tasks.register('runTest', JavaExec) {
	dependsOn classes
	mainClass = "at.jku.isse.ecco.cli.Main"
	jvmArgs += ["-Xss1024m", "-Xmx8g"]
	classpath = sourceSets.test.runtimeClasspath
}

tasks.register('copyScripts', Copy) {
	from 'ecco', 'ecco.bat'
	into project.file('build/bundle/')
}

tasks.register('fatJar', Jar) {
	manifest {
		attributes 'Main-Class': 'at.jku.isse.ecco.cli.Main'
	}
	archiveClassifier = "all"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	} {
		exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
	}
	with jar
}

bundle.dependsOn += copyScripts
