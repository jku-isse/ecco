plugins {
	id 'application'
	alias(libs.plugins.openjfx.javafxplugin)
}

apply plugin: 'java-library'

javafx {
	version = libs.versions.javafx.get()
	modules = [ 'javafx.controls' ]
}

def javafxVersion = libs.versions.javafx.get()
// Real org.openjfx artifact classifiers - "mac"/"mac-aarch64"/"linux"/"linux-aarch64"/"win" (JavaFX
// ships Windows binaries for x86_64 only, so "win" is the only Windows classifier; on Windows-on-ARM
// this only resolves/runs under the JDK's x86_64 emulation layer, since a native arm64 JDK there
// still reports os.arch=aarch64 and there is no windows-aarch64 javafx artifact to fall back to).
def platform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def isArm = System.getProperty("os.arch") in ["aarch64", "arm64"]
	if (os.windows) {
		return "win"
	} else if (os.macOsX) {
		return isArm ? "mac-aarch64" : "mac"
	} else {
		return isArm ? "linux-aarch64" : "linux"
	}
}()

dependencies {
	implementation libs.eclipse.collections.api
	implementation libs.eclipse.collections.core
	implementation libs.guava
	api libs.guice.core
	implementation libs.javaparser.core
    implementation libs.logicng.core
    implementation libs.logicng.parser.j11
    implementation project(':ecco-logic')

	testImplementation project(':ecco-adapter-c')
	//testImplementation project(':ecco-adapter-file')
	testImplementation project(':ecco-adapter-image')
	testImplementation project(':ecco-adapter-text')
	testImplementation project(':ecco-adapter-python')
	testImplementation project(':ecco-adapter-java')
	testImplementation project(':ecco-adapter-lilypond')

	testImplementation libs.commons.io
	testImplementation libs.graphstream.core
	testImplementation libs.graphstream.algo
	testImplementation libs.graphstream.ui.javafx
	// gs-ui-javafx:2.0 transitively depends on org.openjfx:javafx-fxml:13, which has no
	// mac-aarch64 artifact; force it up to a version/platform that actually resolves.
	testImplementation "org.openjfx:javafx-controls:$javafxVersion:$platform"
	testImplementation "org.openjfx:javafx-fxml:$javafxVersion:$platform"

	testImplementation project(':ecco-service')

	testImplementation libs.mockito.core
}
