# Default java.util.logging config: quiet console. ECCO's INFO/CONFIG-level logging is internal
# diagnostic chatter (timings, lifecycle markers, plugin lists) rather than user-facing output --
# CLI/GUI report actual results through their own output paths -- so only WARNING and above print
# by default. Loaded by EccoService's static initializer; override by pointing the JVM at a
# different file via -Djava.util.logging.config.file=... if verbose diagnostics are ever needed.
handlers = java.util.logging.ConsoleHandler
.level = WARNING

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$s %2$s: %5$s%6$n
