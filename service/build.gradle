plugins {
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

apply plugin: 'java-library'

// ecco-adapter-lilypond (a test-only dependency below, needed to exercise all bundled
// artifact plugins via Guice) bundles a JavaFX-based viewer, so its classes reference
// javafx.scene.web.WebView. That's only resolvable with the platform-specific javafx
// artifacts the javafx plugin's variant-aware resolution provides - plain transitive
// project-dependency resolution pulls in the classifier-less (contentless) javafx-web
// jar and fails with NoClassDefFoundError once Guice reflects over that plugin's classes.
javafx {
	version = "21"
	modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.web']
	configuration = 'testImplementation'
}

dependencies {
	implementation 'org.eclipse.collections:eclipse-collections-api:11.1.0'
	implementation 'org.eclipse.collections:eclipse-collections:11.1.0'
	implementation 'org.logicng:logicng:2.6.0'
    implementation("org.logicng:logicng-parser-j11:2.6.0")
	implementation 'org.projectlombok:lombok:1.18.30'
	implementation 'io.github.java-diff-utils:java-diff-utils:4.12'
	implementation 'com.opencsv:opencsv:5.9'
	implementation 'com.google.guava:guava:33.2.1-jre'
	implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.13.3'

	implementation project(':ecco-util')
    implementation project(':ecco-logic')

	api 'com.google.inject:guice:7.0.0'
	api 'com.google.inject.extensions:guice-multibindings:4.2.3'
	api project(':ecco-base')

	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'commons-io:commons-io:2.15.1'

	testImplementation project(':ecco-util')
	testImplementation project(':ecco-adapter-file')
	testImplementation project(':ecco-adapter-text')
	testImplementation project(':ecco-adapter-c')
	testImplementation project(':ecco-adapter-challenge')
	testImplementation project(':ecco-adapter-cpp')
	testImplementation project(':ecco-adapter-runtime')
	testImplementation project(':ecco-adapter-lilypond')

	testRuntimeOnly project(':ecco-adapter-image')
	testRuntimeOnly project(':ecco-adapter-lilypond')
}

// https://stackoverflow.com/questions/67265308/gradle-entry-classpath-is-a-duplicate-but-no-duplicate-handling-strategy-has-b
jar {
	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}
