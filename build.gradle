plugins {
	alias(libs.plugins.nebula.ospackage)
	id 'pmd'
	//id 'checkstyle'
}

allprojects {
	apply plugin: 'idea'
	apply plugin: 'eclipse'
	apply plugin: 'pmd'
	apply plugin: 'jacoco'

	pmd {
		ignoreFailures = true
	}

	jacoco {
		toolVersion = libs.versions.jacoco.tool.get()
	}

	repositories {
		mavenCentral()
	}
}

subprojects {
	ext {
		ecco = {
			adapter = false
			set("storage", false)
		}
	}

	apply plugin: 'java'
	apply plugin: 'maven-publish'
	apply plugin: 'com.netflix.nebula.ospackage'
	//apply plugin: 'checkstyle'

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	dependencies {
		testImplementation libs.junit.jupiter
		// Gradle 9 no longer puts the launcher on the test classpath by itself
		testRuntimeOnly libs.junit.platform.launcher
	}

	jar {
		manifest {
			attributes("Implementation-Title": project.name, "Implementation-Version": project.version, "Implementation-Vendor": project.group)
		}
	}

	sourceSets {
		integrationTest {
			java {
				compileClasspath += main.output + test.output
				runtimeClasspath += main.output + test.output
				srcDir file('src/integrationTest/java')
			}
			resources {
				srcDir file('src/integrationTest/resources')
			}
		}
	}

	configurations {
		integrationTestCompile.extendsFrom implementation
		integrationTestRuntimeOnly.extendsFrom runtimeOnly

		integrationTestImplementation.extendsFrom testImplementation
		integrationTestRuntime.extendsFrom testRuntime
	}

	test {
		useJUnitPlatform()
		outputs.upToDateWhen { false }
		filter {
			exclude("**/integrationTest/**")
		}
		finalizedBy jacocoTestReport
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = true
			html.required = true
		}
	}

	task integrationTest(type: Test, group: 'verification', description: 'Runs the integration tests.') {
		useJUnitPlatform()
		classpath = sourceSets.integrationTest.runtimeClasspath
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		outputs.upToDateWhen { false }
	}
	check.dependsOn -= integrationTest

	task jacocoIntegrationTestReport(type: JacocoReport) {
		dependsOn integrationTest
		executionData(integrationTest)
		sourceSets sourceSets.main
		reports {
			xml.required = true
			html.required = true
		}
	}
	// integrationTest is an eager (old-style "task name(type: X) {}") task creation, whose configuration
	// closure runs immediately at this point in script evaluation - referencing jacocoIntegrationTestReport
	// from inside that closure would fail since it isn't declared yet at that point. Wiring it here, after
	// both tasks exist, avoids that.
	integrationTest.finalizedBy(jacocoIntegrationTestReport)

	tasks.named("processIntegrationTestResources") {
		duplicatesStrategy = DuplicatesStrategy.INCLUDE
	}

	tasks.withType(Test) {
		reports.html.outputLocation = reporting.baseDirectory.dir(name)
		// the LilyPond adapter's musical tokens (LilyEccoTransformer.MUSICAL_TOKENS), for a test run:
		// ./gradlew test -Decco.lilypond.musicalTokens=true
		if (System.getProperty('ecco.lilypond.musicalTokens') != null) {
			systemProperty 'ecco.lilypond.musicalTokens', System.getProperty('ecco.lilypond.musicalTokens')
		}
	}

	// ...and for the applications started through Gradle: ./gradlew :ecco-gui:run -Decco.lilypond.musicalTokens=true
	// (an installed launcher takes it from JAVA_OPTS instead)
	tasks.withType(JavaExec) {
		if (System.getProperty('ecco.lilypond.musicalTokens') != null) {
			systemProperty 'ecco.lilypond.musicalTokens', System.getProperty('ecco.lilypond.musicalTokens')
		}
	}

	idea {
		module {
			testSources.from(file('src/integrationTest/java'))
			scopes.TEST.plus += [configurations.integrationTestCompile]
			downloadJavadoc = true
			downloadSources = true
		}
	}

	eclipse {
		classpath {
			downloadJavadoc = true
			downloadSources = true
		}
	}

	task sourcesJar(type: Jar, group: 'packaging') {
		archiveClassifier = 'sources'
		from sourceSets.main.allSource
	}

	task javadocJar(type: Jar, group: 'packaging', dependsOn: javadoc) {
		archiveClassifier = 'javadoc'
		from javadoc.destinationDir
	}

	publishing {
		publications {
			eccoMaven(MavenPublication) {
				groupId = project.group
				artifactId = project.name
				version = project.version

				from project.components.java

				artifact javadocJar {
				}
				artifact sourcesJar {
				}
			}
		}
		repositories {
			maven {
				name = "GitHubPackages"
				url = System.getenv("GITHUB_PACKAGES_URL")
				credentials {
					username = System.getenv("GITHUB_ACTOR")
					password = System.getenv("GITHUB_TOKEN")
				}
			}
		}
	}

	// # PACKAGING

	ospackage {
		packageName = project.name
		version = project.version
		release = 1
		arch = NOARCH
		os = LINUX

		prefix '/usr/'

		directory('/usr/share/java/ecco')
		directory('/usr/share/java/ecco/lib')

		into('/usr/share/java/') {
			from(project.jar) {
				addParentDirs false
				into 'ecco/'
			}

			from({
				def temp = project.configurations.runtimeClasspath

				project.configurations.findAll { it.name.equals("runtimeClasspath") }.collectMany {
					it.allDependencies
				}.findAll { it instanceof ProjectDependency }.collect {
					project.project((it as ProjectDependency).path).configurations.runtimeClasspath
				}.each { temp = temp - it }

				project.configurations.findAll { it.name.equals("runtimeClasspath") }.collectMany {
					it.allDependencies
				}.findAll { it instanceof ProjectDependency }.collect { project.project((it as ProjectDependency).path).jar.outputs.files }.each {
					temp = temp - it
				}

				return temp
			}) {
				addParentDirs false
				into 'ecco/lib/'
			}
		}
	}

	buildRpm {
	}

	buildDeb {
	}

	task rpm(type: Rpm, group: 'packaging') {
	}

	task deb(type: Deb, group: 'packaging') {
	}

	task sourcesZip(type: Zip, group: 'packaging') {
		//compression = Compression.GZIP
		archiveClassifier = 'src'
		from projectDir
		include 'src/**/*'
		include 'build.gradle'
	}

	task linuxZip(type: Zip, group: 'packaging') {
		archiveClassifier = 'linux'
		into(archiveFileName.get() - ('.' + archiveExtension)) {
			from project.jar
			from project.configurations.runtimeClasspath
		}
	}

	task windowsZip(type: Zip, group: 'packaging') {
		archiveClassifier = 'windows'
		into(archiveFileName.get() - ('.' + archiveExtension)) {
			from project.jar
			from project.configurations.runtimeClasspath
		}
	}

	// # BUNDLING
	task copyJars(type: Copy, dependsOn: project.build) {
		from(project.jar)
		into project.file('build/bundle/')
	}
	task copyDependencies(type: Copy) {
		from(project.configurations.runtimeOnly)
		into project.file('build/bundle/lib/')
	}
	task bundle(dependsOn: [copyJars, copyDependencies])

	task depTest {
		def temp = project.configurations.runtimeOnly
		project.configurations.findAll { it.name.equals("runtimeOnly") }.collectMany { it.allDependencies }.findAll {
			it instanceof ProjectDependency
		}.collect { it.dependencyProject.jar.outputs.files }.each { println it }
	}
}

// generated code, left out of the aggregated coverage report
ext.GENERATED_CODE = ['**/adapter/c/parser/generated/**', '**/adapter/golang/antlr/**']

task jacocoRootReport(type: JacocoReport, group: 'verification') {
	description = 'Generates an aggregated code coverage report across all modules. Combines test and ' +
			'integrationTest exec data when both are present, for an honest total rather than just the ' +
			'default test sourceSet (integrationTest is deliberately not run automatically here, same as ' +
			'it is excluded from check - run it yourself first if you want it folded in).'
	dependsOn subprojects.test

	additionalSourceDirs.from(files(subprojects.collect { it.sourceSets.main.allSource.srcDirs }.flatten()))
	sourceDirectories.from(files(subprojects.collect { it.sourceSets.main.allSource.srcDirs }.flatten()))
	// generated ANTLR parsers (about 17,000 lines in the C and Go adapters) would swamp the adapters' figures
	classDirectories.from(files(subprojects.collect { it.sourceSets.main.output.classesDirs }).asFileTree.matching { exclude GENERATED_CODE })
	executionData.from(files(subprojects.collect { it.tasks.named('jacocoTestReport').get().executionData }).filter { it.exists() })
	executionData.from(files(subprojects.collect { it.tasks.named('jacocoIntegrationTestReport').get().executionData }).filter { it.exists() })

	reports {
		xml.required = true
		html.required = true
	}
}

task coverageSummary {
	group = 'verification'
	description = 'Prints LINE/BRANCH/COMPLEXITY coverage per module and in total, from the aggregated ' +
			'report (jacocoRootReport): every module\'s code counts as covered by any module\'s tests (the ' +
			'adapters are mostly exercised by the service tests), integration tests included when they ran, ' +
			'generated parsers left out. Then the classes whose line coverage most overstates their ' +
			'complexity coverage - a single line can hide several untested branches.'
	dependsOn jacocoRootReport

	doLast {
		// JaCoCo's XML declares a DOCTYPE (report.dtd) that XmlSlurper's default parser refuses; these
		// are locally generated, trusted files and nothing read here needs the DTD, so drop the line
		def report = new XmlSlurper().parseText(file('build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml').text.replaceFirst(/<!DOCTYPE[^>]*>/, ''))
		def countersOf = { node ->
			def totals = [:]
			node.counter.each { c -> totals[c.@type.text()] = [missed: c.@missed.text() as int, covered: c.@covered.text() as int] }
			return totals
		}
		def pct = { totals, type ->
			def c = totals?.get(type)
			if (c == null) return null
			def total = c.missed + c.covered
			return total == 0 ? null : (c.covered / total * 100)
		}
		def fmt = { v -> v == null ? "n/a".padLeft(6) : String.format("%5.1f%%", v) }
		def row = { name, totals -> "  ${name.padRight(24)} LINE=${fmt(pct(totals, 'LINE'))}  BRANCH=${fmt(pct(totals, 'BRANCH'))}  COMPLEXITY=${fmt(pct(totals, 'COMPLEXITY'))}" }

		// class name (as in the report, e.g. at/jku/isse/ecco/Foo$Bar) -> module
		def moduleOf = [:]
		subprojects.each { proj ->
			proj.sourceSets.main.output.classesDirs.each { dir ->
				if (!dir.exists()) return
				proj.fileTree(dir).include('**/*.class').visit { details ->
					if (!details.directory) moduleOf[details.relativePath.pathString - '.class'] = proj.name
				}
			}
		}
		def perModule = [:].withDefault { [:] }
		def classes = []
		report.package.class.each { cls ->
			def totals = countersOf(cls)
			def module = moduleOf[cls.@name.text()] ?: '?'
			totals.each { type, c ->
				def sum = perModule[module][type] ?: [missed: 0, covered: 0]
				perModule[module][type] = [missed: sum.missed + c.missed, covered: sum.covered + c.covered]
			}
			classes << [name: cls.@name.text(), totals: totals]
		}

		println ""
		println "Coverage per module, all tests (LINE / BRANCH / COMPLEXITY):"
		println "-" * 70
		perModule.keySet().sort().each { println row(it, perModule[it]) }
		println "-" * 70
		println row('total', countersOf(report))

		def pythonResults = project(':ecco-adapter-python').file('build/test-results/test')
		def skipped = pythonResults.exists() ? pythonResults.listFiles().findAll { it.name.endsWith('.xml') }.sum(0) { f ->
			(f.text =~ /skipped="(\d+)"/).with { it.find() ? (it.group(1) as int) : 0 }
		} : 0
		if (skipped > 1) // one test is disabled in the code
			println "NOTE: ${skipped} Python adapter tests were skipped - they need `python` with libcst, py4j and parce on the PATH, so its coverage is not measured"

		println ""
		println "Classes where LINE coverage most overstates COMPLEXITY coverage (line >= 50%, sorted by gap):"
		println "-" * 70
		def gaps = []
		classes.each { cls ->
			def line = pct(cls.totals, 'LINE')
			def complexity = pct(cls.totals, 'COMPLEXITY')
			if (line != null && complexity != null && line >= 50)
				gaps << [name: cls.name, line: line, complexity: complexity, gap: line - complexity]
		}
		gaps.sort { -it.gap }
		gaps.take(20).each {
			println "  ${it.name.padRight(65)} LINE=${String.format('%5.1f%%', it.line)}  COMPLEXITY=${String.format('%5.1f%%', it.complexity)}  gap=${String.format('%4.1f', it.gap)}"
		}
		println ""
	}
}

task combinedjavadoc(type: Javadoc, group: "documentation") {
	description = 'Generates a global javadoc from all the modules.'
	source project.subprojects.collect { it.sourceSets.main.allJava }
	classpath = files(project.subprojects.collect { it.sourceSets.main.compileClasspath })
	options.memberLevel = JavadocMemberLevel.PRIVATE
	options.links = ['https://docs.oracle.com/en/java/javase/13/docs/api/']
	destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
}

task combinedrpm(type: Copy, group: 'packaging') {
	dependsOn subprojects.rpm
	into base.distsDirectory.dir('rpm')
	from subprojects.rpm.archiveFile
}

task combineddeb(type: Copy, group: 'packaging') {
	dependsOn subprojects.deb
	into base.distsDirectory.dir('deb')
	from subprojects.deb.archiveFile
}

task combinedLinuxZip(type: Zip, group: 'packaging') {
	into project.name
	archiveClassifier = 'linux'
	destinationDirectory = base.distsDirectory.dir('zip')
	from { subprojects.linuxZip.source }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task combinedWindowsZip(type: Zip, group: 'packaging') {
	into project.name
	archiveClassifier = 'windows'
	destinationDirectory = base.distsDirectory.dir('zip')
	from { subprojects.windowsZip.source }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
