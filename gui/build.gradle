plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	//id 'com.palantir.docker' version '0.30.0'
}

application {
	mainClassName = "at.jku.isse.ecco.gui.Launcher"
	applicationDefaultJvmArgs = ["-Xss1024m", "-Xmx8g"]
}

javafx {
	version = "21.0.4"
	modules = [ 'javafx.controls', 'javafx.web' ]
}

def javafxVersion = "21.0.4"
def platform = "mac-aarch64"

dependencies {
    implementation 'org.graphstream:gs-core:2.0'
    implementation 'org.graphstream:gs-algo:2.0'
    implementation 'org.graphstream:gs-ui-javafx:2.0'
    // gs-ui-javafx:2.0 transitively depends on org.openjfx:javafx-fxml:13, which has no
    // mac-aarch64 artifact; force it up to a version/platform that actually resolves.
    implementation "org.openjfx:javafx-controls:$javafxVersion:$platform"
    implementation "org.openjfx:javafx-fxml:$javafxVersion:$platform"

    implementation project(':ecco-service')
    implementation files('../adapter/java-patched/at.jku.cdl.ecco.adapter.java-patched.jar')

	runtimeOnly project(':ecco-adapter-file')
	runtimeOnly project(':ecco-adapter-text')
	runtimeOnly project(':ecco-adapter-lilypond')
	runtimeOnly project(':ecco-adapter-image')
	runtimeOnly project(':ecco-adapter-typescript')
	runtimeOnly project(':ecco-adapter-python')
	// not enabled by default (see AdapterPreferences.DEFAULT_DISABLED_PLUGIN_IDS), but present on
	// the classpath so they show up as options in the adapter Preferences dialog
	runtimeOnly project(':ecco-adapter-challenge')
	runtimeOnly project(':ecco-adapter-java')
	runtimeOnly project(':ecco-adapter-c')
	runtimeOnly project(':ecco-adapter-cpp')
	runtimeOnly project(':ecco-adapter-runtime')
	runtimeOnly project(':ecco-adapter-golang')

	testRuntimeOnly project(':ecco-adapter-file')
	testRuntimeOnly project(':ecco-adapter-text')
	testRuntimeOnly project(':ecco-adapter-lilypond')
	testRuntimeOnly project(':ecco-adapter-image')
	testRuntimeOnly project(':ecco-adapter-typescript')
	testRuntimeOnly project(':ecco-adapter-challenge')
	testRuntimeOnly project(':ecco-adapter-java')
	testRuntimeOnly project(':ecco-adapter-c')
	testRuntimeOnly project(':ecco-adapter-cpp')
	testRuntimeOnly project(':ecco-adapter-runtime')
	testRuntimeOnly project(':ecco-adapter-golang')
}

tasks.register('jpackageApp', Exec) {
	group = 'distribution'
	description = 'Packages the ECCO GUI as a native application image (e.g. ECCO.app on macOS) via jpackage, so the OS shows "ECCO" instead of "java" as the application name.'
	dependsOn tasks.named('installDist')

	def jpackageExe = org.gradle.internal.jvm.Jvm.current().getExecutable('jpackage')
	def libDir = layout.buildDirectory.dir("install/${project.name}/lib")
	def destDir = layout.buildDirectory.dir('jpackage')

	doFirst {
		project.delete(destDir.get())
	}

	commandLine(
			jpackageExe,
			'--type', 'app-image',
			'--name', 'ECCO',
			'--input', libDir.get().asFile,
			'--main-jar', tasks.named('jar').get().archiveFileName.get(),
			'--main-class', 'at.jku.isse.ecco.gui.Launcher',
			'--dest', destDir.get().asFile,
			'--java-options', '-Xss1024m',
			'--java-options', '-Xmx8g',
	)
}

ospackage {
	summary 'GUI (Graphical User Interface) for ECCO.'
	packageDescription 'This package provides a GUI (Graphical User Interface) for ECCO.'

	requires('ecco-base', version, EQUAL)
	requires('ecco-service', version, EQUAL)

	requires('javapackages-tools')

	into('/usr/bin/') {
		from(project.file('ecco-gui')) {
			addParentDirs false
			into ''
		}
	}
}

linuxZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco-gui'
	}
}

sourcesZip {
	include 'ecco-gui'
	include 'ecco-gui.bat'
}

windowsZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco-gui.bat'
	}
}

tasks.register('copyScripts', Copy) {
	from 'ecco-gui', 'ecco-gui.bat'
	into project.file('build/bundle/')
}

repositories {
	mavenCentral()
}
bundle.dependsOn += copyScripts
