plugins {
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	//id 'com.palantir.docker' version '0.30.0'
}

application {
	mainClassName = "at.jku.isse.ecco.gui.Launcher"
	applicationDefaultJvmArgs = ["-Xss1024m", "-Xmx8g"]
}

javafx {
	version = "21.0.4"
	modules = [ 'javafx.controls', 'javafx.web' ]
}

def javafxVersion = "21.0.4"
// Real org.openjfx artifact classifiers - "mac"/"mac-aarch64"/"linux"/"linux-aarch64"/"win" (JavaFX
// ships Windows binaries for x86_64 only, so "win" is the only Windows classifier; on Windows-on-ARM
// this only resolves/runs under the JDK's x86_64 emulation layer, since a native arm64 JDK there
// still reports os.arch=aarch64 and there is no windows-aarch64 javafx artifact to fall back to).
def platform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def isArm = System.getProperty("os.arch") in ["aarch64", "arm64"]
	if (os.windows) {
		return "win"
	} else if (os.macOsX) {
		return isArm ? "mac-aarch64" : "mac"
	} else {
		return isArm ? "linux-aarch64" : "linux"
	}
}()

dependencies {
    // macOS-style ("Cupertino") JavaFX theme - see EccoGui.showMainStage()
    implementation 'io.github.mkpaz:atlantafx-base:2.1.0'

    // Native bridge (JNA) to AppKit's NSMenu, used only to install a "Preferences..." item into
    // the real macOS application menu - see MainView's Mac app-menu setup. No-ops safely (via its
    // own DummyNativeAdapter) on Windows/Linux, so it's safe to always include.
    implementation 'de.jangassen:nsmenufx:3.1.0'

    // Icon font glyphs for the ribbon's buttons - see gui/ribbon/RibbonBar.java. Feather (flat,
    // single-stroke) rather than a filled pack like Material2, to match Cupertino's flat aesthetic.
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-feather-pack:12.4.0'

    implementation 'org.graphstream:gs-core:2.0'
    implementation 'org.graphstream:gs-algo:2.0'
    implementation 'org.graphstream:gs-ui-javafx:2.0'
    // gs-ui-javafx:2.0 transitively depends on org.openjfx:javafx-fxml:13, which has no
    // mac-aarch64 artifact; force it up to a version/platform that actually resolves.
    implementation "org.openjfx:javafx-controls:$javafxVersion:$platform"
    implementation "org.openjfx:javafx-fxml:$javafxVersion:$platform"

    implementation project(':ecco-service')
    implementation files('../adapter/java-patched/at.jku.cdl.ecco.adapter.java-patched.jar')
    implementation 'org.logicng:logicng:2.6.0'

	runtimeOnly project(':ecco-adapter-file')
	runtimeOnly project(':ecco-adapter-text')
	runtimeOnly project(':ecco-adapter-lilypond')
	runtimeOnly project(':ecco-adapter-image')
	runtimeOnly project(':ecco-adapter-typescript')
	runtimeOnly project(':ecco-adapter-python')
	// not enabled by default (see AdapterPreferences.DEFAULT_DISABLED_PLUGIN_IDS), but present on
	// the classpath so they show up as options in the adapter Preferences dialog
	runtimeOnly project(':ecco-adapter-challenge')
	runtimeOnly project(':ecco-adapter-java')
	runtimeOnly project(':ecco-adapter-c')
	runtimeOnly project(':ecco-adapter-cpp')
	runtimeOnly project(':ecco-adapter-runtime')
	runtimeOnly project(':ecco-adapter-golang')

	testRuntimeOnly project(':ecco-adapter-file')
	testRuntimeOnly project(':ecco-adapter-text')
	testRuntimeOnly project(':ecco-adapter-lilypond')
	testRuntimeOnly project(':ecco-adapter-image')
	testRuntimeOnly project(':ecco-adapter-typescript')
	testRuntimeOnly project(':ecco-adapter-challenge')
	testRuntimeOnly project(':ecco-adapter-java')
	testRuntimeOnly project(':ecco-adapter-c')
	testRuntimeOnly project(':ecco-adapter-cpp')
	testRuntimeOnly project(':ecco-adapter-runtime')
	testRuntimeOnly project(':ecco-adapter-golang')
}

tasks.register('buildAppIcon') {
	group = 'distribution'
	description = 'Converts the ECCO logo into a macOS .icns, for use as the jpackage app-image icon.'

	def logoFile = project.file('src/main/resources/ecco-logo.png')
	def iconsetDir = layout.buildDirectory.dir('appIcon/ECCO.iconset')
	def icnsFile = layout.buildDirectory.file('appIcon/ECCO.icns')

	inputs.file(logoFile)
	outputs.file(icnsFile)

	doLast {
		def iconset = iconsetDir.get().asFile
		project.delete(iconset)
		iconset.mkdirs()

		// pad the (non-square, wordmarked) logo out to a square canvas on the same navy
		// background EccoGui's splash screen uses, so it isn't squashed when resized to icon sizes.
		// Pad to the logo's own larger dimension (not a fixed size like 1024) so this only adds
		// letterboxing rather than also upscaling the source before the per-size resize below.
		def logoImage = javax.imageio.ImageIO.read(logoFile)
		def squareSize = Math.max(logoImage.width, logoImage.height)
		def padded = new File(iconset, 'padded.png')
		project.exec {
			commandLine 'sips', '-p', squareSize.toString(), squareSize.toString(), '--padColor', '0b0f1a',
					'--out', padded, logoFile
		}

		// standard macOS iconset: each size plus its @2x variant, per `iconutil` requirements.
		[16, 32, 128, 256, 512].each { size ->
			project.exec {
				commandLine 'sips', '-z', size, size, '--out', new File(iconset, "icon_${size}x${size}.png"), padded
			}
			def size2x = size * 2
			project.exec {
				commandLine 'sips', '-z', size2x, size2x, '--out', new File(iconset, "icon_${size}x${size}@2x.png"), padded
			}
		}

		project.exec {
			commandLine 'iconutil', '-c', 'icns', iconset, '-o', icnsFile.get().asFile
		}
	}
}

tasks.register('jpackageApp', Exec) {
	group = 'distribution'
	description = 'Packages the ECCO GUI as a native application image (e.g. ECCO.app on macOS) via jpackage, so the OS shows "ECCO" instead of "java" as the application name.'
	dependsOn tasks.named('installDist'), tasks.named('buildAppIcon')

	def jpackageExe = org.gradle.internal.jvm.Jvm.current().getExecutable('jpackage')
	def libDir = layout.buildDirectory.dir("install/${project.name}/lib")
	def destDir = layout.buildDirectory.dir('jpackage')
	def icnsFile = layout.buildDirectory.file('appIcon/ECCO.icns')

	doFirst {
		project.delete(destDir.get())
	}

	commandLine(
			jpackageExe,
			'--type', 'app-image',
			'--name', 'ECCO',
			'--input', libDir.get().asFile,
			'--main-jar', tasks.named('jar').get().archiveFileName.get(),
			'--main-class', 'at.jku.isse.ecco.gui.Launcher',
			'--dest', destDir.get().asFile,
			'--icon', icnsFile.get().asFile,
			'--java-options', '-Xss1024m',
			'--java-options', '-Xmx8g',
	)
}

tasks.register('buildWindowsAppIcon') {
	group = 'distribution'
	description = 'Converts the ECCO logo into a Windows .ico, for use as the jpackage app-image icon on Windows. Pure-Java (no native tool dependency, unlike buildAppIcon\'s sips/iconutil), so it can be regenerated from any host OS - only jpackageAppWindows itself needs to actually run on Windows.'

	def logoFile = project.file('src/main/resources/ecco-logo.png')
	def icoFile = layout.buildDirectory.file('appIcon/ECCO.ico')

	inputs.file(logoFile)
	outputs.file(icoFile)

	doLast {
		def logoImage = javax.imageio.ImageIO.read(logoFile)
		def squareSize = Math.max(logoImage.width, logoImage.height)

		// pad the (non-square, wordmarked) logo out to a square canvas on the same navy
		// background EccoGui's splash screen uses - same treatment as buildAppIcon's macOS .icns
		def padded = new java.awt.image.BufferedImage(squareSize, squareSize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
		def paddedGraphics = padded.createGraphics()
		paddedGraphics.setColor(new java.awt.Color(0x0b, 0x0f, 0x1a))
		paddedGraphics.fillRect(0, 0, squareSize, squareSize)
		paddedGraphics.drawImage(logoImage, (int) ((squareSize - logoImage.width) / 2), (int) ((squareSize - logoImage.height) / 2), null)
		paddedGraphics.dispose()

		// standard Windows icon sizes; unlike .icns there's no @2x variant, just more entries
		def sizes = [16, 32, 48, 64, 128, 256]
		def pngDataBySize = sizes.collectEntries { size ->
			def resized = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
			def resizedGraphics = resized.createGraphics()
			resizedGraphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
			resizedGraphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
			resizedGraphics.drawImage(padded, 0, 0, size, size, null)
			resizedGraphics.dispose()
			def pngBytes = new java.io.ByteArrayOutputStream()
			javax.imageio.ImageIO.write(resized, 'png', pngBytes)
			[(size): pngBytes.toByteArray()]
		}

		// hand-rolled ICO container: an ICONDIR header followed by one ICONDIRENTRY per size, each
		// entry's image data a plain PNG (a format Windows has accepted inside .ico since Vista) -
		// there's no tool on Windows (nor reliably available cross-platform) that converts a PNG
		// straight to .ico the way sips/iconutil handle .icns on macOS, so this replaces that step.
		def headerSize = 6 + 16 * sizes.size()
		def offset = headerSize
		def dir = java.nio.ByteBuffer.allocate(headerSize).order(java.nio.ByteOrder.LITTLE_ENDIAN)
		dir.putShort((short) 0)
		dir.putShort((short) 1)
		dir.putShort((short) sizes.size())
		sizes.each { size ->
			def byteSize = size == 256 ? 0 : size
			dir.put((byte) byteSize)
			dir.put((byte) byteSize)
			dir.put((byte) 0)
			dir.put((byte) 0)
			dir.putShort((short) 1)
			dir.putShort((short) 32)
			dir.putInt(pngDataBySize[size].length)
			dir.putInt(offset)
			offset += pngDataBySize[size].length
		}

		def icoFileHandle = icoFile.get().asFile
		icoFileHandle.parentFile.mkdirs()
		icoFileHandle.withOutputStream { stream ->
			stream.write(dir.array())
			sizes.each { size -> stream.write(pngDataBySize[size]) }
		}
	}
}

tasks.register('jpackageAppWindows', Exec) {
	group = 'distribution'
	description = 'Packages the ECCO GUI as a native Windows application image (ECCO.exe) via jpackage, so the OS shows "ECCO" instead of "java" as the application name. Must be run on Windows itself - jpackage always targets whatever OS it runs on, and a .ico icon is only meaningful there.'
	dependsOn tasks.named('installDist'), tasks.named('buildWindowsAppIcon')

	def jpackageExe = org.gradle.internal.jvm.Jvm.current().getExecutable('jpackage')
	def libDir = layout.buildDirectory.dir("install/${project.name}/lib")
	def destDir = layout.buildDirectory.dir('jpackageWindows')
	def icoFile = layout.buildDirectory.file('appIcon/ECCO.ico')

	doFirst {
		project.delete(destDir.get())
	}

	commandLine(
			jpackageExe,
			'--type', 'app-image',
			'--name', 'ECCO',
			'--input', libDir.get().asFile,
			'--main-jar', tasks.named('jar').get().archiveFileName.get(),
			'--main-class', 'at.jku.isse.ecco.gui.Launcher',
			'--dest', destDir.get().asFile,
			'--icon', icoFile.get().asFile,
			'--java-options', '-Xss1024m',
			'--java-options', '-Xmx8g',
	)
}

ospackage {
	summary 'GUI (Graphical User Interface) for ECCO.'
	packageDescription 'This package provides a GUI (Graphical User Interface) for ECCO.'

	requires('ecco-base', version, EQUAL)
	requires('ecco-service', version, EQUAL)

	requires('javapackages-tools')

	into('/usr/bin/') {
		from(project.file('ecco-gui')) {
			addParentDirs false
			into ''
		}
	}
}

linuxZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco-gui'
	}
}

sourcesZip {
	include 'ecco-gui'
	include 'ecco-gui.bat'
}

windowsZip {
	into(archiveFileName.get() - ('.' + archiveExtension)) {
		from 'ecco-gui.bat'
	}
}

tasks.register('copyScripts', Copy) {
	from 'ecco-gui', 'ecco-gui.bat'
	into project.file('build/bundle/')
}

repositories {
	mavenCentral()
}
bundle.dependsOn += copyScripts
