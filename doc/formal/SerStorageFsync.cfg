\* as SerStoragePowerLoss.cfg, with the new core and its packs on the disk before the id is written. One reader:
\* with two, power failures and any order of writing back, the states exceed 118 million with no end in sight;
\* concurrent readers are checked in SerStorage.cfg, and whether the files survive a power failure does not
\* depend on a second one
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    CoreIds = {c0, c1, c2, c3}
    Initial = c0
    PowerLoss = TRUE
    Fsync = TRUE
    MaxAttempts = 20
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    RepositoryComplete
    ReadersReadComplete
    WritersBuildOnComplete
