plugins {
    alias(libs.plugins.shadow)
    alias(libs.plugins.micronaut.minimal.application)
}

version = "0.1"
group = "at.jku.isse.ecco.rest"

repositories {
    mavenCentral()
    mavenLocal()
}

configurations.runtimeClasspath {
    // no GUI here (ecco.headless): the adapters' JavaFX viewers are not loaded, so JavaFX is left
    // out - it used to come along bundled into the file adapter's jar
    exclude group: 'org.openjfx'
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-http-validation")

    testImplementation("io.micronaut:micronaut-http-client") // only RestTest uses the client
    implementation("io.micronaut:micronaut-jackson-databind")
    implementation("io.micronaut:micronaut-runtime")
    implementation("jakarta.annotation:jakarta.annotation-api")

    annotationProcessor("io.micronaut.validation:micronaut-validation-processor")
    implementation("io.micronaut.validation:micronaut-validation")

    annotationProcessor("io.micronaut.security:micronaut-security-annotations")
    implementation("io.micronaut.reactor:micronaut-reactor")
    implementation("io.micronaut.security:micronaut-security-jwt")

    annotationProcessor(libs.micronaut.openapi)
    implementation("io.swagger.core.v3:swagger-annotations")

    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("org.yaml:snakeyaml")

    implementation project(':ecco-service')

    runtimeOnly project(':ecco-adapter-file')
    runtimeOnly project(':ecco-adapter-text')
    runtimeOnly project(':ecco-adapter-image')
    runtimeOnly project(':ecco-adapter-java')

    // the following should be "testRuntimeOnly". however, javafx seems to mess up these dependencies for the entire project.
    testImplementation project(':ecco-adapter-file')
    testImplementation project(':ecco-adapter-text')
    testImplementation project(':ecco-adapter-image')
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.core

}

test {
    // like Application.main: no GUI, so the adapters leave out their JavaFX viewers
    systemProperty 'ecco.headless', 'true'
    useJUnitPlatform()
}

application {
    mainClass.set("at.jku.isse.ecco.rest.Application")
}
java {
    sourceCompatibility = JavaVersion.toVersion("21")
    targetCompatibility = JavaVersion.toVersion("21")
}

micronaut {
    version = "4.1.0"
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("at.jku.isse.ecco.rest.*")
    }
}

//run.dependsOn += build
