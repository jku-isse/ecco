rxjava2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }

[plugins]
nebula-ospackage = { id = "com.netflix.nebula.ospackage", version.ref = "plugin-nebula-ospackage" }
openjfx-javafxplugin = { id = "org.openjfx.javafxplugin", version.ref = "plugin-openjfx" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "plugin-graalvm-native" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "plugin-node-gradle" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "plugin-shadow" }
micronaut-minimal-application = { id = "io.micronaut.minimal.application", version.ref = "plugin-micronaut-app" }