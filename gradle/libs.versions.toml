guava = { module = "com.google.guava:guava", version.ref = "guava" }
guice-core = { module = "com.google.inject:guice", version.ref = "guice-core" }
guice-multibindings = { module = "com.google.inject.extensions:guice-multibindings", version.ref = "guice-multibindings" }
