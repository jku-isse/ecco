# shared across base/service/cli/gui/logic/adapter-challenge
logicng = "2.6.0"
eclipse-collections = "11.1.0"
guava = "33.2.1-jre"
guice-core = "7.0.0"
guice-multibindings = "4.2.3"
javaparser = "3.25.8"
commons-io = "2.15.1"

# service
lombok = "1.18.30"
java-diff-utils = "4.12"
opencsv = "5.9"
jgit = "6.10.0.202406032230-r"
jackson-databind = "2.15.3"
jackson-core = "2.15.3"

# gui
atlantafx = "2.1.0"
nsmenufx = "3.1.0"
ikonli = "12.4.0"
graphstream = "2.0"
javafx = "22.0.2"

# cli
argparse4j = "0.9.0"

# web
slf4j = "2.0.10"
jersey = "3.1.5"
jaxb-api = "2.3.1"

# adapter-c / adapter-golang
antlr4 = "4.13.2"

# adapter-challenge
commons-collections4 = "4.4"
log4j-api = "2.23.1"

# adapter-typescript
javet = "2.1.2"
junit4 = "4.13.1"

# adapter-lilypond
testng-core = "7.10.2"
testng-engine = "1.0.6"
commons-math3 = "3.6.1"
py4j = "0.10.9.7"
graalvm-polyglot-tck = "23.1.1"

# rest (versions not managed by the Micronaut BOM)
micronaut-openapi = "6.3.0"
rxjava = "2.2.21"

# plugins
plugin-nebula-ospackage = "12.+"
plugin-openjfx = "0.1.0"
plugin-graalvm-native = "0.10.3"
plugin-node-gradle = "7.0.1"
plugin-shadow = "8.1.1"
plugin-micronaut-app = "4.2.1"

[libraries]
