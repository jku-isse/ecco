plugins {
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

ecco.adapter = true

javafx {
	version = "22.0.2"
	modules = [ 'javafx.controls', 'javafx.swing' ]
}

dependencies {
	implementation project(':ecco-service')
}

ospackage {
	requires('ecco-base', version, EQUAL)
	requires('ecco-service', version, EQUAL)
}
