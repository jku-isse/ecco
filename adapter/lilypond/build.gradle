plugins {
	alias(libs.plugins.openjfx.javafxplugin)
}

ecco.adapter = true

javafx {
	version = libs.versions.javafx.get()
	modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.web']
}

sourceSets {
	main {
		if (!use_py4j_parser.toBoolean()) {
			java {
				exclude '**/py4j/**'
			}
		}
		if (!use_graalvm_parser.toBoolean()) {
			java {
				exclude '**/graalvm/**'
			}
			resources {
				exclude 'graalVM-config.properties'
			}
		}
		if (!use_lilypond.toBoolean()) {
			resources {
				exclude 'lilypond-config.properties'
			}
		}
	}
}

dependencies {
	implementation project(':ecco-service')
	testImplementation libs.testng.core
	// bridges the JUnit Platform (used by the shared integrationTest task) to TestNG, whose
	// annotations this module's integrationTest classes use
	integrationTestRuntimeOnly libs.testng.engine
	implementation libs.commons.math3
	if (use_py4j_parser.toBoolean()) {
		println 'include py4j dependency'
		implementation libs.py4j
	}
	if (use_graalvm_parser.toBoolean()) {
		println 'include graalvm dependency'
		implementation libs.graalvm.polyglot.tck
	}
}

ospackage {
	requires('ecco-base', version, EQUAL)
	requires('ecco-service', version, EQUAL)
}